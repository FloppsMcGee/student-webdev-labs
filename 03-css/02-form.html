<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>CSS Exercise 02 - Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="color-bg-blue">
    <main class="form-container">
      <form action="/submitform" method="post" class="ira-form">
        <h1 class="main-heading-form">Roth IRA Calculator</h1>
        <div class="form-element">
          <label class="form-label" for="balance">Balance ($)</label>
          <input
            class="form-input"
            type="text"
            id="balance"
            name="balance"
            required
          />
        </div>

        <div class="form-element">
          <label class="form-label" for="annual">Annual Contribution ($)</label>
          <input
            class="form-input"
            type="text"
            id="annual"
            name="annual"
            required
          />
        </div>

        <fieldset>
          <legend>Maximize Contributions?</legend>
          <div class="form-radios">
            <input type="radio" id="maximize-yes" name="maximize" value="yes" />
            <label for="maximize-yes">Yes</label>
            <input type="radio" id="maximize-no" name="maximize" value="no" />
            <label for="maximize-no">No</label>
          </div>
        </fieldset>

        <div class="form-element">
          <label class="form-label" for="rate"
            >Expected Rate of Return (%)</label
          >
          <input
            class="form-input"
            type="number"
            id="rate"
            name="rate"
            required
          />
        </div>

        <div class="form-element">
          <label class="form-label" for="age">Current Age</label>
          <input
            class="form-input"
            type="number"
            id="age"
            name="age"
            required
          />
        </div>

        <div class="form-element">
          <label class="form-label" for="retirement">Retirement Age</label>
          <input
            class="form-input"
            type="number"
            id="retirement"
            name="retirement"
            required
          />
        </div>

        <div class="form-element">
          <label class="form-label" for="tax">Marginal Tax Rate (%)</label>
          <input
            class="form-input"
            type="number"
            id="tax"
            name="tax"
            required
          />
        </div>

        <div class="form-element">
          <input class="btn button-submit" type="submit" value="Calculate" />
          <input class="btn button-reset" type="reset" value="Reset" />
        </div>
      </form>
      <p class="form-note">
        This exercise is a simplified version of the Roth IRA Calculator at
        <a href="https://www.calculator.net/roth-ira-calculator.html"
          >Calculator.net</a
        >
      </p>
    </main>
  </body>
</html>
